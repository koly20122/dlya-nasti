<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Насти 💐</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .video-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0;
            background: linear-gradient(145deg, #fdeff2 0%, #f8e8ec 100%);
        }

        .video-wrapper {
            background: rgba(255, 240, 245, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(255, 170, 190, 0.4);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 2px solid rgba(255, 200, 220, 0.5);
        }

        .video-wrapper video {
            width: 100%;
            height: auto;
            max-height: 45vh;
            min-height: 200px;
            object-fit: contain;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn {
            background: #ffb6c1;
            border: none;
            color: #5e3a44;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 16px 30px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d48b9b, 0 10px 25px rgba(255, 150, 180, 0.4);
            transition: 0.1s ease;
            border: 2px solid rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            width: fit-content;
            margin: 0 auto;
            min-width: 200px;
        }

        .btn.secondary {
            background: #ffe2e9;
            box-shadow: 0 3px 0 #d4a2b0;
            color: #754956;
            font-size: 1rem;
            padding: 12px 25px;
            min-width: 180px;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #d48b9b, 0 8px 20px rgba(255, 150, 180, 0.4);
        }

        #downloadBtnContainer {
            margin-top: 5px;
            text-align: center;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border-radius: 20px;
            padding: 15px;
            margin-top: 10px;
            text-align: center;
            border: 1px solid #c3e6cb;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container video-page">
        <div class="video-wrapper">
            <!-- Видео (лежит в корне) -->
            <video id="myVideo" playsinline webkit-playsinline>
                <source src="0903.mp4" type="video/mp4">
                Твой браузер не поддерживает видео.
            </video>
            
            <!-- Кнопка Play -->
            <div style="text-align: center;">
                <button class="btn" id="playBtn">▶ Нажми меня</button>
            </div>
            
            <!-- Кнопка "Запомнить момент" (появляется после видео) -->
            <div id="downloadBtnContainer" style="display: none; text-align: center;">
                <button class="btn secondary" id="downloadBtn">💾 Скачать видео</button>
            </div>

            <!-- Сообщение об успехе -->
            <div id="successMessage" class="success-message" style="display: none;">
                ✅ Скачивание началось...<br>
                📱 Открой папку "Загрузки" и сохрани в фото
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playBtn = document.getElementById('playBtn');
        const downloadContainer = document.getElementById('downloadBtnContainer');
        const successMessage = document.getElementById('successMessage');
        
        const videoFileName = '0903.mp4';

        // Определяем, iPhone ли это
        const isIPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Кнопка Play
        playBtn.addEventListener('click', () => {
            // Прячем кнопку сразу
            playBtn.style.display = 'none';
            
            if (isIPhone) {
                // СПЕЦИАЛЬНО ДЛЯ SAFARI НА IPHONE
                
                // Пытаемся войти в полноэкранный режим (webkitEnterFullscreen)
                if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
                
                // Запускаем видео с небольшой задержкой
                setTimeout(() => {
                    video.play().catch(error => {
                        console.log('Ошибка воспроизведения:', error);
                    });
                }, 100);
                
            } else {
                // Для остальных браузеров
                video.play().then(() => {
                    if (video.requestFullscreen) {
                        video.requestFullscreen();
                    }
                }).catch(error => {
                    console.log('Ошибка:', error);
                });
            }
        });

        // Отслеживаем окончание видео
        video.addEventListener('ended', () => {
            downloadContainer.style.display = 'block';
        });

        // Для iPhone: если вышли из fullscreen, но видео закончилось
        video.addEventListener('webkitendfullscreen', () => {
            if (video.ended) {
                downloadContainer.style.display = 'block';
            }
        });

        // Скачивание видео
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const link = document.createElement('a');
            link.href = videoFileName;
            link.download = 'dlya_nasti.mp4';
            link.target = '_blank';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            successMessage.style.display = 'block';
            
            if (isIPhone) {
                successMessage.innerHTML = `
                    ✅ Видео загружается...<br>
                    📱 Открой папку "Загрузки" и нажми<br>
                    <strong>"Сохранить видео"</strong>
                `;
            }
        });

        // Если видео уже закончилось по какой-то причине
        video.addEventListener('pause', function() {
            if (video.ended) {
                downloadContainer.style.display = 'block';
            }
        });
    </script>
</body>
</html>
